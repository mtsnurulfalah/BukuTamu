    Buku Tamu
  </text>

  <text x="500" y="935"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#159447">
    MTs Nurul Falah
  </text>

  <!-- Gold ornaments -->
  <rect x="115" y="915" width="85" height="12" rx="6"
        fill="#F0B928"/>
  <rect x="800" y="915" width="85" height="12" rx="6"
        fill="#F0B928"/>

</svg>
