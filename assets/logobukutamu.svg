<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1000"
     width="1000"
     height="1000">

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#149447"/>
      <stop offset="100%" stop-color="#006B35"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4C542"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
  </defs>

  <!-- ========================= -->
  <!-- EMBLEM -->
  <!-- ========================= -->

  <!-- Islamic arch -->
  <path d="
    M220 390
    V290
    C220 145 340 70 500 70
    C660 70 780 145 780 290
    V390
    L735 350
    V295
    C735 190 640 125 500 125
    C360 125 265 190 265 295
    V350 Z"
    fill="url(#green)"/>

  <!-- Star -->
  <path d="
    M500 145
    L514 177
    L549 180
    L522 203
    L530 237
    L500 219
    L470 237
    L478 203
    L451 180
    L486 177 Z"
    fill="url(#gold)"/>

  <!-- People -->
  <circle cx="500" cy="315" r="62" fill="url(#green)"/>
  <path d="
    M405 490
    C405 405 440 365 500 365
    C560 365 595 405 595 490
    L595 540
    L405 540 Z"
