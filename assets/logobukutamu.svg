  <!-- Checklist -->
  <path d="M650 335 l14 14 l25 -28"
        fill="none" stroke="#159447"
        stroke-width="13" stroke-linecap="round"
        stroke-linejoin="round"/>
  <line x1="710" y1="335" x2="770" y2="335"
        stroke="#159447" stroke-width="13"
        stroke-linecap="round"/>

  <path d="M650 390 l14 14 l25 -28"
        fill="none" stroke="#159447"
        stroke-width="13" stroke-linecap="round"
        stroke-linejoin="round"/>
  <line x1="710" y1="390" x2="770" y2="390"
        stroke="#159447" stroke-width="13"
        stroke-linecap="round"/>

  <path d="M650 445 l14 14 l25 -28"
        fill="none" stroke="#159447"
        stroke-width="13" stroke-linecap="round"
        stroke-linejoin="round"/>
  <line x1="710" y1="445" x2="770" y2="445"
        stroke="#159447" stroke-width="13"
        stroke-linecap="round"/>

  <!-- Digital pixels -->
  <rect x="815" y="255" width="38" height="38" rx="7" fill="#159447"/>
  <rect x="865" y="300" width="30" height="30" rx="6" fill="#F0B928"/>
  <rect x="820" y="315" width="38" height="38" rx="7" fill="#159447"/>
  <rect x="870" y="360" width="25" height="25" rx="5" fill="#159447"/>

  <!-- ========================= -->
  <!-- OPEN BOOK -->
  <!-- ========================= -->

  <path d="
